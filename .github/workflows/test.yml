name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and expect
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y zsh expect
          else
            brew install expect
          fi

      - name: Syntax check
        run: |
          for f in yanker.plugin.zsh test/*.zsh; do
            zsh -n "$f" || exit 1
          done

      - name: Run tests
        run: zsh test/run.zsh
